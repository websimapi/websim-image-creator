  <title>Image Creator</title>
  <link rel="stylesheet" href="style.css">

<body>
  <div class="container">
    <h1>Create an Image Element</h1>
    <form id="imgForm">
      <label for="imgText">Enter image URL/Prompt:</label>
      <input type="text" id="imgText" name="imgText" placeholder="Enter image URL or prompt" required>
      <button type="submit">Submit</button>
    </form>
    <div id="imageContainer">
      <!-- Images will appear here -->
    </div>
  </div>

  <script type="module" src="main.js"></script>
